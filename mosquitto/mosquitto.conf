# mosquitto.conf
# Local development broker config for the Perimeter Intrusion Detection project.
#
# Run with:
#   mosquitto -c mosquitto.conf
#
# This exposes:
#   - port 1883 : standard MQTT, used by the ESP32 / Python backend (simulator.py, live_classifier.py)
#   - port 9001 : MQTT over WebSockets, used by the React dashboard (browsers can't do raw MQTT/TCP)
#
# NOTE: allow_anonymous true is fine for local dev/demo only. For anything
# exposed beyond your own machine, set up a password file instead:
#   mosquitto_passwd -c passwd_file your_username

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

# Uncomment to persist retained messages/session state between restarts
# persistence true
# persistence_location ./mosquitto_data/
